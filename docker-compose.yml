services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgerlane
      POSTGRES_PASSWORD: ledgerlane_pw
      POSTGRES_DB: ledgerlane
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlane -d ledgerlane"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ledgerlane
      PGPASSWORD: ledgerlane_pw
      PGDATABASE: ledgerlane
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
